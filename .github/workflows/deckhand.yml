name: Deckhand focused checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundations:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/deckhand/upstream-maintenance.test.mjs
      - run: node scripts/deckhand/check-upstream-patches.mjs
      - run: pnpm exec vp lint apps/server/src/deckhand packages/contracts/src/deckhand apps/web/src/deckhand scripts/deckhand scripts/lib/deckhand-distribution.ts
      - run: pnpm exec vp test run scripts/deckhand/distribution.test.ts apps/server/src/deckhand apps/server/src/persistence/Layers/Sqlite.test.ts packages/shared/src/devHome.test.ts packages/shared/src/providerAuthReturnUrl.test.ts packages/shared/src/codexAuthHandoff.test.ts apps/desktop/src/app/DesktopEnvironment.test.ts apps/desktop/src/app/DesktopUserData.test.ts apps/desktop/src/electron/ElectronProtocol.test.ts apps/server/src/telemetry/AnalyticsService.test.ts apps/web/src/branding.test.ts
      - run: pnpm exec vp run --filter t3 --filter @t3tools/contracts --filter @t3tools/desktop --filter @t3tools/web --filter @t3tools/shared typecheck
      - run: pnpm exec vp test run apps/server/src/cloud/pinnedRuntime.test.ts apps/server/src/boot/bootService.test.ts scripts/build-desktop-artifact.test.ts
      - run: pnpm run build:desktop
