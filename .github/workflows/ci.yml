name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Verify localization catalogs
        run: |
          set -euo pipefail
          mkdir -p build/swift-module-cache
          swift -module-cache-path build/swift-module-cache tools/localization/CatalogTool.swift verify

      - name: Run tests
        env:
          # The following tests crash on GitHub Actions macOS runners (Swift concurrency /
          # headless CGS), so they are skipped in CI and run locally instead.
          CINDERDECK_CI_SKIP_TESTS: |
            CinderdeckTests/GoogleDriveTests
            CinderdeckTests/DatabaseManagerTests
            CinderdeckTests/QuickAccessCoreTests/testQuickAccessCountdownTimer_pauseResumePreservesRemainingTime
            CinderdeckTests/QuickAccessCoreTests/testQuickAccessCountdownTimer_cancelPreventsExpiration
            CinderdeckTests/QuickAccessCoreTests/testQuickAccessTrackpadSwipeModeStore_persistsMode
            CinderdeckTests/QuickAccessCoreTests/testQuickAccessTrackpadSwipeModeStore_resetToDefault
            CinderdeckTests/OCRRecognitionTests
            CinderdeckTests/CustomOCRModelStoreTests
            CinderdeckTests/OCRModelSelectionTests
            CinderdeckTests/PreferencesOCRModelSelectionTests
            CinderdeckTests/OCRKeychainStoreTests
            CinderdeckTests/RemoteOCRServiceTests
            CinderdeckTests/SmartElementCaptureControllerTests
            CinderdeckTests/SmartElementWindowOwnerResolverTests
            CinderdeckTests/SmartElementQueryServiceTests
            CinderdeckTests/AppStatusBarControllerTests
            CinderdeckTests/RecordingAudioLevelMeterTests
            CinderdeckTests/RecordingToolbarWindowTests/testShowRecordingStatusBar_alreadyVisibleWindow_enablesBackgroundDragging
            CinderdeckTests/CaptureViewModelTests/testHiddenWindowSession_restore_postsSyntheticMouseMovedEvent
            CinderdeckTests/AnnotateCreationTests/testCanExtractTextRequiresNormalAnnotateSourceImage
            CinderdeckTests/AnnotateExportSaveTests/testCopyToClipboardRunsWithoutCrashing
            CinderdeckTests/AnnotateExportSaveTests/testSaveAsIsCoveredByManualInteractionOnly
            CinderdeckTests/AnnotateBackgroundRedactionTests/testApplyBackgroundCutoutStartsProcessingOnSupportedOS
            CinderdeckTests/AnnotateBackgroundRedactionTests/testAutoRedactSensitiveDataStartsScan
            CinderdeckTests/AnnotateMockupTests/testMockupExporterRenderProducesImageWithSourceImage
            CinderdeckTests/AnnotateTextSnappingTests/testDetectorReportsTextNearTheImageTopWithAHighY
            CinderdeckTests/AnnotateBlurCacheManagerTests/testGetCachedBlur_nonBlockingSchedulesRender
            CinderdeckTests/InlineAreaAnnotateSessionTests/testAnnotateWindowConsumesCopyAndDuplicateWhenNothingIsSelected
            CinderdeckTests/InlineAreaAnnotateSessionTests/testUpdateSelectionPublishesPointerLocation
            CinderdeckTests/InlineAreaAnnotateSessionTests/testEndSelectionClearsPointerLocation
            CinderdeckTests/AreaSelectionMultiMonitorReconciliationTests
            CinderdeckTests/AreaSelectionSessionLifecycleTests
            CinderdeckTests/AreaSelectionHoverPerformanceTests
            CinderdeckTests/AreaSelectionControllerTests
            CinderdeckTests/AreaSelectionModelsTests
            CinderdeckTests/AreaSelectionOverlayPassthroughStaleLocationTests
            CinderdeckTests/AreaSelectionLivePassthroughWindowDetectionTests
            CinderdeckTests/AreaSelectionOverlayMagnifierLayoutTests/testMagnifierZoom_worksWithEmptyBackdropsInitially
            CinderdeckTests/PersistedCombineSessionTests/testCaptureStitchSaveReopen_persistsStitchEverywhere
            CinderdeckTests/BackgroundCursorControlTests
            CinderdeckTests/LivePassthroughInputLogicTests
            CinderdeckTests/HotkeyUnregistrationTests
            CinderdeckTests/RecordingSessionShortcutGatingTests
            CinderdeckTests/RecordingSessionHotkeyRegistrationTests
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/ci-test.xcresult
          test_args=()
          if [[ -n "${CINDERDECK_CI_SKIP_TESTS:-}" ]]; then
            skip_tests="${CINDERDECK_CI_SKIP_TESTS//$'\n'/ }"
            skip_tests="${skip_tests//,/ }"
            skip_tests="${skip_tests//;/ }"
            echo "Skipping XCTest identifiers from CINDERDECK_CI_SKIP_TESTS:"
            for test_id in $skip_tests; do
              [[ -z "$test_id" ]] && continue
              echo "  - $test_id"
              test_args+=("-skip-testing:$test_id")
            done
          fi

          if ! xcodebuild \
            -project Cinderdeck.xcodeproj \
            -scheme Cinderdeck \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ci-test.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${test_args[@]}" \
            test > build/ci-test.log 2>&1; then
            echo "::group::Likely test failures"
            grep -E "Test [Cc]ase '.*' (failed|skipped)|Test crashed|malloc:|Failing tests:|\\*\\* TEST FAILED \\*\\*|error:" build/ci-test.log || true
            echo "::endgroup::"
            tail -200 build/ci-test.log
            exit 1
          fi

          tail -20 build/ci-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-diagnostics
          path: |
            build/ci-test.log
            build/ci-test.xcresult

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p build

          if ! xcodebuild \
            -project Cinderdeck.xcodeproj \
            -scheme Cinderdeck \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build > build/ci-build.log 2>&1; then
            tail -100 build/ci-build.log
            exit 1
          fi

          tail -20 build/ci-build.log

      - name: Verify app bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Cinderdeck.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Cinderdeck.app not found at expected path"
            exit 1
          fi
          echo "Build successful: $APP_PATH"
